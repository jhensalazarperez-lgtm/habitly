<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-brand">
      <p class="auth-app-name">{{ app_name }}</p>
      <p class="auth-tagline">{{ tagline }}</p>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">Welcome back</h1>

      {% if error %}
      <p class="auth-error">{{ error }}</p>
      {% endif %}

      <form method="POST" action="{{ url_for('login_page') }}">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="primary-button full-width">Log In</button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a href="{{ url_for('signup_page') }}">Sign up</a>
      </p>
    </div>
  </div>

</body>
</html>
